_schema-version: "3.1"
ID: assemblyimpact-ai
version: 0.5.0
description: AssemblyImpact AI - engineering change impact (CAP, SAP HANA Cloud, XSUAA, SAPUI5). Synthetic demo data only.
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - node tools/btp/stage-ui.mjs

modules:
  - name: assemblyimpact-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: assemblyimpact-db
      - name: assemblyimpact-auth
      - name: assemblyimpact-destination

  - name: assemblyimpact-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
    requires:
      - name: assemblyimpact-db

  - name: assemblyimpact-router
    type: approuter.nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: assemblyimpact-auth

resources:
  - name: assemblyimpact-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: assemblyimpact-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: assemblyimpact-ai-${org}-${space}
        tenant-mode: dedicated
  - name: assemblyimpact-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
