name: M03 verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --package-lock-only --audit-level=high
      # BTP preparation: the production build must succeed and must not contain demo data.
      - run: npx --yes -p @sap/cds-dk@10.2.1 cds build --production
      - run: test -d gen/srv && test -d gen/db && ! ls gen/db/src/gen/data 2>/dev/null | grep -q hdbtabledata
