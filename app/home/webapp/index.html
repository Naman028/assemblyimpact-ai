<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Standalone preview (Fiori tools). The normal entry point is /launchpad.html, where this app is the home page. -->
  <style>html, body, body > div, #container, #container-uiarea { height: 100%; margin: 0; }</style>
  <script id="sap-ui-bootstrap"

    data-sap-ui-theme="sap_horizon"
    data-sap-ui-resource-roots='{ "assemblyimpact.home": "./" }'
    data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
    data-sap-ui-compat-version="edge"
    data-sap-ui-async="true"
    data-sap-ui-frame-options="trusted"></script>
</head>
<body class="sapUiBody" id="content">
  <div data-sap-ui-component data-name="assemblyimpact.home" data-id="container"
       data-settings='{"id" : "assemblyimpact.home"}' data-handle-validation="true"></div>
